name: Import Aurora System bundle

on:
  push:
    paths:
      - '.bundle/**'

permissions:
  contents: write

concurrency:
  group: aurora-bundle-import
  cancel-in-progress: false

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Importar pacote
        shell: bash
        run: |
          set -euo pipefail
          [ -f .bundle/ready ] || exit 0
          cat .bundle/part.* | base64 -d > /tmp/aurora.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name .git ! -name .github ! -name .bundle -exec rm -rf {} +
          tar -xzf /tmp/aurora.tar.gz -C .
          rm -rf .bundle
          rm -f .github/workflows/import-aurora.yml
          rmdir .github/workflows 2>/dev/null || true
          rmdir .github 2>/dev/null || true
          git config user.name "YOSHISET Automation"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Replace old WhatsApp bot with Aurora System"
          git push
